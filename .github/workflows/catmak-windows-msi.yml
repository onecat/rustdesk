name: Build CatMak RustDesk x64 MSI

on:
  workflow_dispatch:
  push:
    branches:
      - catmak-rustdesk-1.4.9

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-x64-msi:
    name: windows-x64-msi
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with RustDesk custom Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          Move-Item -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == "${{ env.FLUTTER_VERSION }}" ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r log_file; do
              echo "$log_file:"
              cat "$log_file"
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true

      - name: Prepare preset permanent password
        shell: pwsh
        env:
          CATMAK_PERMANENT_PASSWORD: ${{ secrets.CATMAK_PERMANENT_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CATMAK_PERMANENT_PASSWORD)) {
            throw "Repository secret CATMAK_PERMANENT_PASSWORD is required"
          }

          $saltBytes = New-Object byte[] 32
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try {
            $rng.GetBytes($saltBytes)
          } finally {
            $rng.Dispose()
          }
          $salt = [Convert]::ToBase64String($saltBytes)

          $material = [Text.Encoding]::UTF8.GetBytes($env:CATMAK_PERMANENT_PASSWORD + $salt)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $h1 = $sha.ComputeHash($material)
          } finally {
            $sha.Dispose()
          }
          $storage = "00" + [Convert]::ToBase64String($h1)

          Write-Output "::add-mask::$storage"
          Write-Output "::add-mask::$salt"
          Add-Content -Path $env:GITHUB_ENV -Value "CATMAK_PRESET_PASSWORD_HASH=$storage"
          Add-Content -Path $env:GITHUB_ENV -Value "CATMAK_PRESET_PASSWORD_SALT=$salt"

      - name: Build RustDesk x64
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          Move-Item -Force .\usbmmidd_v2 ./rustdesk

          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

            $checksumDriver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $downloadDriver = (Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256).Hash
            $checksumAdapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadAdapter = (Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256).Hash

            if ($checksumDriver -eq $downloadDriver -and $checksumAdapter -eq $downloadAdapter) {
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              New-Item -ItemType Directory -Force ./rustdesk/drivers | Out-Null
              Move-Item -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              Move-Item -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
            Write-Host "Printer driver download is optional; continuing without it."
          }

      - name: Restore RustDeskTempTopMostWindow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
        with: {}

      - name: Build MSI
        shell: pwsh
        run: |
          Push-Location ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          if (-not $msi) { throw "Package.msi was not produced" }
          Pop-Location

          New-Item -ItemType Directory -Force ./Artifacts | Out-Null
          Move-Item $msi.FullName ./Artifacts/rustdesk-catmak-${{ env.VERSION }}-x86_64.msi
          Get-FileHash ./Artifacts/rustdesk-catmak-${{ env.VERSION }}-x86_64.msi -Algorithm SHA256 | Format-List

      - name: Upload MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-catmak-${{ env.VERSION }}-x86_64-msi
          path: ./Artifacts/rustdesk-catmak-${{ env.VERSION }}-x86_64.msi
          if-no-files-found: error
