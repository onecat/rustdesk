name: Continue RustDesk Managed Release Train

on:
  workflow_run:
    workflows: ["Build RustDesk Managed x64 MSI"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  trigger-r7:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'rustdesk-managed-1.4.9-r6'
    runs-on: ubuntu-22.04
    steps:
      - name: Trigger r7 build after successful r6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run managed-windows-msi.yml \
            --repo "${{ github.repository }}" \
            --ref rustdesk-managed-1.4.9-r7
