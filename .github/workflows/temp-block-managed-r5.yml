name: Block Invalid Managed r5 Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  block:
    if: github.event.head_commit.message == 'Block invalid Managed r5 release'
    runs-on: ubuntu-22.04
    steps:
      - name: Create draft r5 blocker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view managed-1.4.9-r5 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "r5 release already exists; no blocker needed."
            exit 0
          fi
          gh release create managed-1.4.9-r5 \
            --repo "${{ github.repository }}" \
            --draft \
            --title "TEMPORARY BLOCKER - DO NOT USE" \
            --notes "Temporary draft used to prevent publication of an invalid MSI revision during CI review."
