name: Remove Managed r5 Blocker

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Remove invalid Managed r5 blocker'
    runs-on: ubuntu-22.04
    steps:
      - name: Delete temporary draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view managed-1.4.9-r5 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete managed-1.4.9-r5 --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
