name: Promote RustDesk Managed Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Managed version already published, for example 1.4.9-r4
        required: true
        type: string
      channel:
        description: Update channel to promote
        required: true
        default: test
        type: choice
        options:
          - test
          - stable
      rollout:
        description: Percentage of eligible clients (0-100)
        required: true
        default: "100"
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]] || {
            echo "Invalid version"; exit 1;
          }
          [[ "${{ inputs.rollout }}" =~ ^[0-9]+$ ]] || {
            echo "Invalid rollout"; exit 1;
          }
          if [ "${{ inputs.rollout }}" -lt 0 ] || [ "${{ inputs.rollout }}" -gt 100 ]; then
            echo "Rollout must be 0..100"; exit 1
          fi

      - name: Checkout exact build source for signing helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.MANAGED_SOURCE_SHA }}
          path: source

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check pynacl==1.5.0

      - name: Download and verify exact released MSI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG="managed-$VERSION"
          MSI="rustdesk-managed-$VERSION-x86_64.msi"
          mkdir -p promote-input
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$MSI" \
            --pattern "managed-build.json" \
            --dir promote-input
          test -f "promote-input/$MSI"
          test -f "promote-input/managed-build.json"

          python - <<'PY'
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path("promote-input")
          meta = json.loads((root / "managed-build.json").read_text(encoding="utf-8-sig"))
          expected_version = os.environ["EXPECTED_VERSION"]
          msi = root / f"rustdesk-managed-{expected_version}-x86_64.msi"
          if meta.get("version") != expected_version:
              raise SystemExit("Release metadata version mismatch")
          if meta.get("msi_file") != msi.name:
              raise SystemExit("Release metadata MSI filename mismatch")
          data = msi.read_bytes()
          actual_hash = hashlib.sha256(data).hexdigest()
          if actual_hash.lower() != str(meta.get("sha256", "")).lower():
              raise SystemExit("Released MSI SHA256 does not match managed-build.json")
          if len(data) != int(meta.get("size", -1)):
              raise SystemExit("Released MSI size does not match managed-build.json")
          source_sha = str(meta.get("source_sha", ""))
          if len(source_sha) != 40 or any(c not in "0123456789abcdefABCDEF" for c in source_sha):
              raise SystemExit("Release metadata source_sha is invalid")
          update_public_key = str(meta.get("update_public_key", ""))
          try:
              update_public_key_bytes = base64.b64decode(update_public_key, validate=True)
          except Exception:
              raise SystemExit("Release metadata update_public_key is invalid base64")
          if len(update_public_key_bytes) != 32:
              raise SystemExit("Release metadata update_public_key must be 32 bytes")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"MANAGED_BUILD={int(meta['build'])}\n")
              fh.write(f"MANAGED_SOURCE_SHA={source_sha}\n")
              fh.write(f"MANAGED_UPDATE_PUBLIC_KEY={update_public_key}\n")
          PY

          echo "MANAGED_MSI=$MSI" >> "$GITHUB_ENV"
          echo "MANAGED_TAG=$TAG" >> "$GITHUB_ENV"
          echo "MANAGED_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/$MSI" >> "$GITHUB_ENV"

      - name: Sign update manifest
        env:
          RUSTDESK_UPDATE_SIGNING_SEED: ${{ secrets.RUSTDESK_UPDATE_SIGNING_SEED }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUSTDESK_UPDATE_SIGNING_SEED" || {
            echo "RUSTDESK_UPDATE_SIGNING_SEED secret is required"; exit 1;
          }

          derived_public_key="$(python source/scripts/managed_update_sign.py public-key)"
          if [ "$derived_public_key" != "$MANAGED_UPDATE_PUBLIC_KEY" ]; then
            echo "Signing seed does not match the public key embedded in this MSI"
            exit 1
          fi

          args=(
            sign-manifest
            --msi "promote-input/$MANAGED_MSI"
            --version "${{ inputs.version }}"
            --build "$MANAGED_BUILD"
            --channel "${{ inputs.channel }}"
            --url "$MANAGED_URL"
            --rollout "${{ inputs.rollout }}"
            --output "${{ inputs.channel }}.json"
          )
          # V4 intentionally does not implement forced interruption/restart.
          # The manifest field remains false until that policy is designed separately.
          python source/scripts/managed_update_sign.py "${args[@]}"

      - name: Publish signed channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="${{ inputs.channel }}"
          if gh release view managed-update --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload managed-update "$CHANNEL.json" \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create managed-update "$CHANNEL.json" \
              --repo "${{ github.repository }}" \
              --title "RustDesk Managed Update Manifests" \
              --notes "Signed update channel manifests used by RustDesk Managed clients."
          fi
