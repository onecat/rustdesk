name: Promote RustDesk Managed Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Managed version already published, for example 1.4.9-r4
        required: true
        type: string
      build:
        description: Monotonic Managed build number, for example 1004
        required: true
        type: string
      channel:
        description: Update channel to promote
        required: true
        default: test
        type: choice
        options:
          - test
          - stable
      rollout:
        description: Percentage of eligible clients (0-100)
        required: true
        default: "100"
        type: string
      mandatory:
        description: Mark the update as mandatory metadata
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout signing helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]] || {
            echo "Invalid version"; exit 1;
          }
          [[ "${{ inputs.build }}" =~ ^[0-9]+$ ]] || {
            echo "Invalid build"; exit 1;
          }
          [[ "${{ inputs.rollout }}" =~ ^[0-9]+$ ]] || {
            echo "Invalid rollout"; exit 1;
          }
          if [ "${{ inputs.rollout }}" -lt 0 ] || [ "${{ inputs.rollout }}" -gt 100 ]; then
            echo "Rollout must be 0..100"; exit 1
          fi

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check pynacl==1.5.0

      - name: Download exact released MSI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG="managed-$VERSION"
          MSI="rustdesk-managed-$VERSION-x86_64.msi"
          mkdir -p promote-input
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "$MSI" \
            --dir promote-input
          test -f "promote-input/$MSI"
          echo "MANAGED_MSI=$MSI" >> "$GITHUB_ENV"
          echo "MANAGED_TAG=$TAG" >> "$GITHUB_ENV"
          echo "MANAGED_URL=https://github.com/${{ github.repository }}/releases/download/$TAG/$MSI" >> "$GITHUB_ENV"

      - name: Sign update manifest
        env:
          RUSTDESK_UPDATE_SIGNING_SEED: ${{ secrets.RUSTDESK_UPDATE_SIGNING_SEED }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUSTDESK_UPDATE_SIGNING_SEED" || {
            echo "RUSTDESK_UPDATE_SIGNING_SEED secret is required"; exit 1;
          }

          args=(
            sign-manifest
            --msi "promote-input/$MANAGED_MSI"
            --version "${{ inputs.version }}"
            --build "${{ inputs.build }}"
            --channel "${{ inputs.channel }}"
            --url "$MANAGED_URL"
            --rollout "${{ inputs.rollout }}"
            --output "${{ inputs.channel }}.json"
          )
          if [ "${{ inputs.mandatory }}" = "true" ]; then
            args+=(--mandatory)
          fi
          python scripts/managed_update_sign.py "${args[@]}"

      - name: Publish signed channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="${{ inputs.channel }}"
          if gh release view managed-update --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload managed-update "$CHANNEL.json" \
              --clobber --repo "${{ github.repository }}"
          else
            gh release create managed-update "$CHANNEL.json" \
              --repo "${{ github.repository }}" \
              --title "RustDesk Managed Update Manifests" \
              --notes "Signed update channel manifests used by RustDesk Managed clients."
          fi
